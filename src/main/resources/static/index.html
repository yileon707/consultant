<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f2eb">
    <title>雅鉴生活志 · AI 顾问</title>
    <link rel="stylesheet" href="/app.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.31/dist/vue.global.min.js"></script>
</head>
<body>
<div id="app">
<div :class="['app-shell', { 'theme-dark': darkMode }]">
    <aside class="app-sidebar" aria-label="主导航">
        <div class="sidebar-content">
            <div class="brand-lockup">
                <div class="brand-mark" aria-hidden="true">雅</div>
                <div>
                    <div class="brand-name">雅鉴生活志</div>
                    <div class="brand-caption">生活方式顾问</div>
                </div>
            </div>

            <button class="new-conversation-button" type="button" @click="startNewConversation">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                <span>开启新对话</span>
                <span class="shortcut">⌘ N</span>
            </button>

            <div class="sidebar-section">
                <div class="sidebar-label">探索</div>
                <nav class="sidebar-nav">
                    <button class="nav-item active" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8.38 8.38 0 0 1-9 8.5 9.9 9.9 0 0 1-4.1-.9L3 20l1.2-3.4A8.3 8.3 0 0 1 3 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 8 8.5Z"/><path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01"/></svg>
                        <span>AI 顾问</span>
                    </button>
                    <button class="nav-item" type="button" @click="startNewConversation">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V5.8A1.8 1.8 0 0 1 5.8 4h12.4A1.8 1.8 0 0 1 20 5.8v12.4a1.8 1.8 0 0 1-1.8 1.8H8.5L4 19.5Z"/><path d="M8 9h8M8 13h5"/></svg>
                        <span>新的灵感</span>
                    </button>
                </nav>
            </div>

            <div class="sidebar-note">
                <div class="note-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 3.5 14 9l5.5 2-5.5 2-2 5.5-2-5.5-5.5-2 5.5-2 2-5.5Z"/><path d="m19 4 .6 1.7L21.5 6l-1.9.7L19 8.5l-.6-1.8-1.9-.7 1.9-.6L19 4Z"/></svg>
                </div>
                <div>
                    <strong>本地生活，一站式问答</strong>
                    <p>找店、领券、预约，吃喝玩乐都可以问我。</p>
                </div>
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="status-line"><span class="status-dot"></span>服务在线</div>
            <div class="sidebar-footer-meta">AI 顾问 · v1.0</div>
        </div>
    </aside>

    <main class="conversation-shell">
        <header class="topbar">
            <div class="mobile-brand">
                <div class="brand-mark small" aria-hidden="true">雅</div>
                <span>雅鉴生活志</span>
            </div>
            <div class="topbar-context">
                <span class="context-kicker">附近好生活</span>
                <span class="context-divider"></span>
                <span class="context-name">吃喝玩乐，先问雅鉴</span>
            </div>
            <div class="topbar-actions">
                <button class="icon-button" type="button" @click="startNewConversation" aria-label="新建对话" title="新建对话">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button class="icon-button" type="button" @click="toggleDarkMode" :aria-label="darkMode ? '切换浅色模式' : '切换深色模式'" :title="darkMode ? '切换浅色模式' : '切换深色模式'">
                    <svg v-if="!darkMode" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M4.4 4.4l1.4 1.4M18.2 18.2l1.4 1.4M2.5 12h2M19.5 12h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4"/></svg>
                    <svg v-else viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4 8.5 8.5 0 1 0 20 15.3Z"/></svg>
                </button>
                <div class="profile-avatar" aria-label="当前用户">我</div>
            </div>
        </header>

        <section class="conversation-stage" ref="chatContainer" aria-live="polite">
            <div class="conversation-inner">
                <div v-if="messages.length === 1 && !isLoading" class="welcome-panel">
                    <div class="welcome-eyebrow"><span></span> 雅鉴生活志 AI 顾问</div>
                    <h1>吃喝玩乐，<em>先问雅鉴。</em></h1>
                    <p class="welcome-copy">餐厅怎么选、优惠券怎么用、预约如何安排？把需求告诉我，帮你更快找到合适的本地生活选择。</p>

                    <div class="suggestion-grid" aria-label="快捷提问">
                        <button type="button" class="suggestion-card" @click="useSuggestion('帮我找一家适合朋友聚餐的餐厅')">
                            <span class="suggestion-icon dining" aria-hidden="true">食</span>
                            <span><strong>觅一处好餐厅</strong><small>朋友聚会 · 想吃得舒服</small></span>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
                        </button>
                        <button type="button" class="suggestion-card" @click="useSuggestion('帮我看看附近有哪些优惠券')">
                            <span class="suggestion-icon voucher" aria-hidden="true">惠</span>
                            <span><strong>发现一份好优惠</strong><small>代金券 · 精打细算</small></span>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
                        </button>
                        <button type="button" class="suggestion-card" @click="useSuggestion('帮我安排一个周末晚餐预约')">
                            <span class="suggestion-icon reserve" aria-hidden="true">约</span>
                            <span><strong>安排一场好约会</strong><small>预约 · 让计划刚刚好</small></span>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
                        </button>
                    </div>
                </div>

                <div v-for="(message, index) in messages" :key="index" :class="['message-row', message.role]">
                    <div v-if="message.role !== 'user'" class="assistant-avatar" aria-hidden="true">
                        <span>雅</span>
                    </div>
                    <div class="message-stack">
                        <div class="message-meta">
                            <span>{{ message.role === 'user' ? '你' : '雅鉴顾问' }}</span>
                            <span v-if="message.role !== 'user'" class="meta-badge">AI</span>
                        </div>
                        <div :class="['message-bubble', { 'is-loading': message.isLoading }]">
                            <div v-if="message.role !== 'user' && message.isLoading" class="loading-dots" aria-label="正在思考">
                                <span></span><span></span><span></span>
                            </div>
                            <div v-else class="message-text">
                                <template v-for="(char, charIndex) in message.content" :key="charIndex">
                                    <span :class="{'char-hidden': charIndex >= message.visibleChars}">{{ char }}</span>
                                </template>
                                <span v-if="message.isStreaming" class="typing-cursor" aria-hidden="true"></span>
                            </div>
                        </div>
                    </div>
                    <div v-if="message.role === 'user'" class="user-avatar" aria-hidden="true">我</div>
                </div>
            </div>
        </section>

        <footer class="composer-area">
            <div class="composer-inner">
                <div class="composer-heading">
                    <span class="composer-prompt">从一个念头开始</span>
                    <span class="composer-hint">Enter 发送 · Esc 停止</span>
                </div>
                <div class="composer-card" :class="{ 'is-focused': userInput.length > 0 }">
                    <textarea
                            v-model="userInput"
                            @keydown.enter.exact.prevent="sendMessage"
                            @keydown.ctrl.enter.exact.prevent="sendMessage"
                            @keydown.esc.exact="stopResponse"
                            placeholder="问问今天的雅鉴顾问…"
                            rows="1"
                            ref="textarea"
                            aria-label="输入你的问题"
                            @input="adjustTextareaHeight"
                    ></textarea>
                    <button
                            type="button"
                            @click="isLoading ? stopResponse() : sendMessage()"
                            :disabled="!userInput.trim() && !isLoading"
                            :class="['send-button', { 'stop-button': isLoading }]"
                            :aria-label="isLoading ? '停止生成' : '发送消息'"
                    >
                        <svg v-if="!isLoading" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 8-16 8 3.2-8L4 4Z"/><path d="M7.2 12H20"/></svg>
                        <svg v-else viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
                    </button>
                </div>
                <p class="composer-disclaimer">雅鉴顾问会结合当前可用的商家与优惠信息回答，重要信息请以实际情况为准。</p>
            </div>
        </footer>
    </main>
</div>
</div>

<script>
    const {createApp, ref, nextTick, onMounted} = Vue;

    createApp({
        setup() {
            const messages = ref([]);
            const userInput = ref('');
            const isLoading = ref(false);
            const chatContainer = ref(null);
            const textarea = ref(null);
            const darkMode = ref(false);

            const memoeryId = ref(Date.now().toString());
            let controller = null;
            let typingInterval = null;

            const adjustTextareaHeight = () => {
                const textareaEl = textarea.value;
                if (!textareaEl) return;
                textareaEl.style.height = 'auto';
                textareaEl.style.height = `${Math.min(textareaEl.scrollHeight, 180)}px`;
            };

            const scrollToBottom = () => {
                nextTick(() => {
                    if (chatContainer.value) {
                        chatContainer.value.scrollTop = chatContainer.value.scrollHeight;
                    }
                });
            };

            const toggleDarkMode = () => {
                darkMode.value = !darkMode.value;
                localStorage.setItem('darkMode', darkMode.value);
            };

            const startNewConversation = () => {
                if (controller) controller.abort();
                if (typingInterval) clearInterval(typingInterval);
                typingInterval = null;
                isLoading.value = false;
                controller = null;
                messages.value = [];
                memoeryId.value = Date.now().toString();
                messages.value.push({
                    role: 'assistant',
                    content: '你好！我是雅鉴生活志的 AI 顾问，请问今天想从哪里开始？',
                    isLoading: false,
                    visibleChars: 0,
                    isStreaming: false
                });
                messages.value[0].visibleChars = messages.value[0].content.length;
                nextTick(() => textarea.value && textarea.value.focus());
            };

            const useSuggestion = (prompt) => {
                userInput.value = prompt;
                nextTick(() => {
                    adjustTextareaHeight();
                    textarea.value && textarea.value.focus();
                });
            };

            const startTypingEffect = (messageIndex) => {
                const message = messages.value[messageIndex];
                if (!message || message.visibleChars >= message.content.length) {
                    clearInterval(typingInterval);
                    typingInterval = null;
                    if (message) message.isStreaming = false;
                    return;
                }
                message.visibleChars++;
                scrollToBottom();
            };

            const sendMessage = async () => {
                if (!userInput.value.trim() || isLoading.value) return;

                if (controller) controller.abort();
                controller = new AbortController();

                const userMessage = {
                    role: 'user',
                    content: userInput.value.trim(),
                    isLoading: false,
                    visibleChars: userInput.value.trim().length,
                    isStreaming: false
                };
                messages.value.push(userMessage);

                const assistantMessage = {
                    role: 'assistant',
                    content: '',
                    isLoading: true,
                    visibleChars: 0,
                    isStreaming: true
                };
                messages.value.push(assistantMessage);

                userInput.value = '';
                adjustTextareaHeight();
                scrollToBottom();
                isLoading.value = true;

                try {
                    const response = await fetch(`/chat?message=${encodeURIComponent(userMessage.content)}&memoryId=${memoeryId.value}`, {
                        signal: controller.signal,
                        // 兼容服务升级前后的纯文本流响应；实际内容类型由后端返回头决定。
                        headers: {Accept: '*/*'}
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    if (!response.body) throw new Error('服务未返回有效内容');

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';
                    const messageIndex = messages.value.length - 1;

                    if (typingInterval) {
                        clearInterval(typingInterval);
                        typingInterval = null;
                    }

                    while (true) {
                        const {done, value} = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, {stream: true});
                        messages.value[messageIndex].content = buffer;
                        messages.value[messageIndex].isLoading = false;
                        if (!typingInterval) {
                            typingInterval = setInterval(() => startTypingEffect(messageIndex), 20);
                        }
                        scrollToBottom();
                    }

                    const finalChunk = decoder.decode();
                    if (finalChunk) messages.value[messageIndex].content += finalChunk;
                } catch (error) {
                    if (error.name === 'AbortError') {
                        console.log('请求被用户中止');
                    } else {
                        console.error('请求出错:', error);
                        const lastMessage = messages.value[messages.value.length - 1];
                        lastMessage.content = '抱歉，请求过程中出现错误: ' + error.message;
                        lastMessage.visibleChars = lastMessage.content.length;
                    }
                } finally {
                    const lastMessage = messages.value[messages.value.length - 1];
                    if (lastMessage) {
                        lastMessage.isLoading = false;
                        lastMessage.isStreaming = false;
                        lastMessage.visibleChars = lastMessage.content.length;
                    }
                    isLoading.value = false;
                    controller = null;
                    if (typingInterval) {
                        clearInterval(typingInterval);
                        typingInterval = null;
                    }
                    scrollToBottom();
                }
            };

            const stopResponse = () => {
                if (controller) controller.abort();
                const lastMessage = messages.value[messages.value.length - 1];
                if (lastMessage) {
                    lastMessage.isLoading = false;
                    lastMessage.isStreaming = false;
                    lastMessage.visibleChars = lastMessage.content.length;
                }
                isLoading.value = false;
                controller = null;
                if (typingInterval) {
                    clearInterval(typingInterval);
                    typingInterval = null;
                }
            };

            onMounted(() => {
                const savedDarkMode = localStorage.getItem('darkMode');
                darkMode.value = savedDarkMode === 'true';
                messages.value.push({
                    role: 'assistant',
                    content: '你好！我是雅鉴生活志的 AI 顾问，请问今天想从哪里开始？',
                    isLoading: false,
                    visibleChars: 0,
                    isStreaming: false
                });
                messages.value[0].visibleChars = messages.value[0].content.length;
                nextTick(() => textarea.value && textarea.value.focus());
            });

            return {
                messages,
                userInput,
                isLoading,
                darkMode,
                chatContainer,
                textarea,
                sendMessage,
                stopResponse,
                toggleDarkMode,
                adjustTextareaHeight,
                startNewConversation,
                useSuggestion
            };
        }
    }).mount('#app');
</script>
</body>
</html>
